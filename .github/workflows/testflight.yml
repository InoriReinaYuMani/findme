name: TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: TestFlight changelog
        required: false
        default: Automated TestFlight build from GitHub Actions.

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Upload to TestFlight
        env:
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane ios beta
