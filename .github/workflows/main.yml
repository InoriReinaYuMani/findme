name: iOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select default Xcode
        run: xcodebuild -version

      - name: Install tooling
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint
        run: swiftlint lint --strict

      - name: Swift package tests
        run: swift test

      - name: Xcode build and tests
        run: |
          xcodebuild test \
            -scheme FindMe \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
