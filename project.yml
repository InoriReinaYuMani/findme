name: FindMe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FindMeCore:
    path: .
targets:
  FindMe:
    type: application
    platform: iOS
    sources:
      - path: FindMeApp/FindMeApp
    info:
      path: FindMeApp/FindMeApp/Info.plist
    dependencies:
      - package: FindMeCore
        product: FindMeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.findme
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  FindMeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FindMeCoreTests
    dependencies:
      - package: FindMeCore
        product: FindMeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FindMe:
    build:
      targets:
        FindMe: all
    test:
      gatherCoverageData: true
      targets:
        - FindMeCoreTests
